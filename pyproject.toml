[project]
name = "agent-eval"
version = "0.1.0"
description = "LangChain refund-support agent evaluated with DeepEval agentic metrics"
readme = "README.md"
authors = [
    { name = "ALAN ANTO", email = "89739433+alankudakkad17@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "deepeval>=4.3.4",
    "langchain>=1.4.10",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.24",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
    "truststore>=0.10.5",
]

[project.scripts]
agent-eval = "agent_eval:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
